<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe | Vaibhav Satish</title>
    <link rel="stylesheet" href="css/research.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body>
    <main class="main-content">
        <h1 class="section-title">Email updates</h1>
        <p id="unsubscribe-status" class="artifacts-intro" aria-live="polite">Would you like to stop receiving research artifact emails?</p>
        <button id="unsubscribe-button" class="home-tab-btn" type="button">Unsubscribe</button>
        <a href="artifacts.html" class="pub-link">Back to Artifacts</a>
    </main>
    <script>
        (function () {
            const status = document.querySelector('#unsubscribe-status');
            const button = document.querySelector('#unsubscribe-button');
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) { status.textContent = 'This unsubscribe link is missing its token.'; button.disabled = true; return; }
            button.addEventListener('click', async function () {
                button.disabled = true;
                status.textContent = 'Updating your subscription…';
                try {
                    const response = await fetch('https://frgzcwsqbakawyrqegxj.supabase.co/functions/v1/unsubscribe-artifacts', {
                        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmcmd6Y3dzcWJha3d5cnFlZ3hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTY4MjgsImV4cCI6MjEwMTU3MjgyOH0.gx7BkqFV604F-KclMAgaJ_c-s7Re9FFnlZoGs1PAVSI', Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmcmd6Y3dzcWJha3d5cnFlZ3hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTY4MjgsImV4cCI6MjEwMTU3MjgyOH0.gx7BkqFV604F-KclMAgaJ_c-s7Re9FFnlZoGs1PAVSI' }, body: JSON.stringify({ token })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Could not update your subscription.');
                    status.textContent = 'You have been unsubscribed from artifact email updates.';
                    button.hidden = true;
                } catch (error) {
                    status.textContent = error.message || 'Could not update your subscription.';
                    button.disabled = false;
                }
            });
        }());
    </script>
</body>
</html>
